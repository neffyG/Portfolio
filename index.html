<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!--
  Content Security Policy.
  Scripts are same-origin only ('self'), no inline JS, which is why all the
  logic lives in app.js instead of in a <script> block here. marked and
  DOMPurify are vendored locally under /vendor so there's no CDN in the supply
  chain. connect-src is opened just enough to let the terminal pull my public
  repos and READMEs from GitHub, nothing else.
-->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self';
  style-src 'self' 'unsafe-inline';
  img-src 'self' data: https://*.githubusercontent.com;
  connect-src 'self' https://api.github.com https://raw.githubusercontent.com;
  base-uri 'none';
  form-action 'none';
  frame-ancestors 'none';
">
<meta name="referrer" content="strict-origin-when-cross-origin">

<title>neftali garcia lopez // workstation</title>

<style>
  /* ------------------------------------------------------------------
     phosphor CRT workstation theme.
     two-color phosphor: green by default, amber via the `theme` command.
     the whole look hangs on three things: the phosphor glow on text, the
     scanlines, and a faint flicker. all motion respects prefers-reduced-motion.
     ------------------------------------------------------------------ */
  :root {
    --phosphor: #2bff6a;
    --phosphor-dim: #1f8f44;
    --phosphor-faint: #0e3c1f;
    --bg: #050805;
    --bg-screen: #071007;
    --glow: 0 0 4px rgba(43,255,106,.45), 0 0 11px rgba(43,255,106,.18);
  }
  html[data-theme="amber"] {
    --phosphor: #ffb43a;
    --phosphor-dim: #b3781f;
    --phosphor-faint: #3c2a0e;
    --bg: #080503;
    --bg-screen: #100a05;
    --glow: 0 0 4px rgba(255,180,58,.45), 0 0 11px rgba(255,180,58,.18);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--phosphor);
    font-family: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono",
                 Menlo, monospace;
    font-size: 15px;
    line-height: 1.55;
    text-shadow: var(--glow);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: stretch;
  }

  /* the monitor bezel that frames the screen */
  .bezel {
    width: 100%;
    max-width: 980px;
    margin: 18px;
    border: 2px solid var(--phosphor-faint);
    border-radius: 14px;
    background:
      radial-gradient(120% 120% at 50% 0%, var(--bg-screen) 0%, var(--bg) 80%);
    box-shadow: inset 0 0 90px rgba(0,0,0,.9), 0 0 0 6px #0a0a0a, 0 14px 40px rgba(0,0,0,.7);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* scanlines + faint screen curvature vignette */
  .bezel::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,.22) 3px,
      rgba(0,0,0,0) 4px
    );
    z-index: 5;
  }
  .bezel::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    box-shadow: inset 0 0 120px rgba(0,0,0,.75);
    z-index: 4;
  }

  /* flicker, but only if the visitor hasn't asked for reduced motion */
  @media (prefers-reduced-motion: no-preference) {
    .bezel { animation: flicker 6s infinite steps(60); }
    @keyframes flicker {
      0%, 97%, 100% { opacity: 1; }
      98% { opacity: .96; }
      99% { opacity: .99; }
    }
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 16px;
    border-bottom: 1px solid var(--phosphor-faint);
    color: var(--phosphor-dim);
    font-size: 12px;
    letter-spacing: .08em;
    text-transform: uppercase;
    z-index: 6;
  }

  .screen {
    flex: 1;
    padding: 18px 20px 8px;
    overflow-y: auto;
    z-index: 6;
    scrollbar-width: thin;
    scrollbar-color: var(--phosphor-dim) transparent;
  }
  .screen::-webkit-scrollbar { width: 8px; }
  .screen::-webkit-scrollbar-thumb { background: var(--phosphor-dim); border-radius: 4px; }

  .line { white-space: pre-wrap; word-break: break-word; }
  .dim { color: var(--phosphor-dim); }
  .err { color: #ff5d5d; text-shadow: 0 0 6px rgba(255,93,93,.4); }

  /* the input row at the bottom: prompt + the field the visitor types in */
  .inputrow {
    display: flex;
    align-items: center;
    padding: 6px 20px 16px;
    z-index: 6;
  }
  .prompt { color: var(--phosphor); margin-right: 8px; white-space: nowrap; }
  #cmd {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--phosphor);
    font: inherit;
    text-shadow: var(--glow);
    caret-color: var(--phosphor);
  }

  a { color: var(--phosphor); text-decoration: underline; text-underline-offset: 3px; }
  a:focus-visible, #cmd:focus-visible { outline: 1px dashed var(--phosphor); outline-offset: 2px; }

  /* markdown rendered from GitHub READMEs gets toned down to fit the screen */
  .readme { border-left: 2px solid var(--phosphor-faint); padding-left: 14px; margin: 6px 0 10px; }
  .readme h1, .readme h2, .readme h3 { color: var(--phosphor); font-size: 1em; margin: 12px 0 4px; }
  .readme code { background: var(--phosphor-faint); padding: 1px 4px; border-radius: 3px; }
  .readme pre { background: #0a0a0a; padding: 10px; overflow-x: auto; border: 1px solid var(--phosphor-faint); }
  .readme table { border-collapse: collapse; }
  .readme td, .readme th { border: 1px solid var(--phosphor-faint); padding: 3px 8px; }
  .readme img { max-width: 100%; }

  .banner { color: var(--phosphor); }

  @media (max-width: 600px) {
    body { font-size: 13px; }
    .bezel { margin: 8px; }
  }
</style>
</head>
<body>
  <main class="bezel" aria-label="terminal workstation">
    <div class="topbar">
      <span>neftali@workstation</span>
      <span id="clock" aria-hidden="true"></span>
    </div>

    <div id="screen" class="screen" role="log" aria-live="polite"></div>

    <div class="inputrow">
      <span class="prompt" id="prompt">visitor@ngl:~$</span>
      <input id="cmd" type="text" autocomplete="off" autocapitalize="off"
             autocorrect="off" spellcheck="false"
             aria-label="terminal command input" />
    </div>
  </main>

  <noscript>
    <p style="padding:20px">This portfolio is a JavaScript terminal. With JS off,
    the short version: I'm Neftali Garcia Lopez, a CS student at ASU focused on
    cybersecurity. Find my work at github.com/neffyG.</p>
  </noscript>

  <!-- vendored locally, no CDN. order matters: purify before app.
       the ?v= on app.js is a cache-buster: bump the number whenever you change
       app.js so the browser and Cloudflare can't keep serving an old copy. -->
  <script src="vendor/purify.min.js"></script>
  <script src="vendor/marked.min.js"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
